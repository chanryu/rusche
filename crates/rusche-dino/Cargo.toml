[package]
name = "rusche-dino"
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Chan Ryu"]
description = "A Chrome-dino-style runner host for the Rusche Scheme-like language"
publish = false

[lib]
name = "rusche_dino"
path = "src/lib.rs"

[[bin]]
name = "rusche-dino"
path = "src/main.rs"

[dependencies]
rusche = { path = "../.." }
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
